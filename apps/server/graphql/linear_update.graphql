mutation OrbitLinearUpdate($id: String!, $input: IssueUpdateInput!) {
  issueUpdate(id: $id, input: $input) {
    success
    issue {
      id
      identifier
      title
      url
      updatedAt
      priority
      state {
        id
        name
        type
      }
      assignee {
        id
        name
      }
    }
  }
}
