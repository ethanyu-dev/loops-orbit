[workspace]
members = ["apps/server", "crates/agent-runtime"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

# 统一直接依赖版本；最终解析版本由 Cargo.lock 固定。
[workspace.dependencies]
aes = "0.9.3"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono-tz = "0.10.4"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
jieba-rs = "0.11.0"
tantivy = { version = "0.26.2", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http-body-util = "0.1.5"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[workspace.dependencies.sqlx]
version = "0.9.0"
default-features = false
features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "macros",
]

# 两个 crate 显式继承规则；CI 将警告视为错误。
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
